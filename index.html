<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experimental Sound Synthesizer — полевой рекордер несуществующих мест</title>
  <meta name="description" content="Введите место и время — и прибор настроится на природу, которой нет: ветер, дождь, гроза и лес из простых электронных сигналов, без сэмплов.">

  <!-- Шрифты: ссылка здесь, имена — в src/styles/fonts.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">

  <!-- Стили: шрифты → тема → база → блоки (src/styles/blocks/*.css) -->
  <link rel="stylesheet" href="./src/styles/index.css">
</head>
<body>
  <!-- Каркас. Каждый блок рисует своё содержимое сам: модуль src/ui/<блок>.js, стили blocks/<блок>.css -->

  <!-- Мир: пейзаж места на весь экран (p5) -->
  <div class="world" aria-hidden="true"></div>

  <!-- Ручки внутри мира: облако — голос A, горизонт — голос B -->
  <div class="sky-handle"></div>
  <div class="horizon-handle"></div>

  <!-- Название места и время -->
  <header class="hud"></header>

  <!-- Куда отправимся: место и время, места-пресеты, ссылка -->
  <form class="place-bar" aria-label="Место и время"></form>

  <!-- Лист наблюдения: точные настройки выбранного голоса (открывается по клику на облако или горизонт) -->
  <aside class="sheet" hidden></aside>

  <!-- Погода: цепочка эффектов выбранного канала — ЖАР → МАРЕВО → УЩЕЛЬЕ → ДАЛЬ -->
  <section class="weather-kit" aria-label="Погода — цепочка эффектов"></section>

  <!-- План местности: каналы как источники вокруг слушателя (расстояние — громкость, сторона — панорама) -->
  <section class="field-map" aria-label="План местности — каналы"></section>

  <!-- Тропа: 16 наблюдений, частицы -->
  <section class="trail" aria-label="Тропа — 16 наблюдений частиц"></section>

  <!-- Рекордер: запись экспедиции, старт и стоп, темп, общий уровень -->
  <section class="recorder" aria-label="Рекордер"></section>

  <!-- Подсказка по клавишам -->
  <footer class="hint-line"></footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>

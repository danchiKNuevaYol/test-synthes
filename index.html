<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experimental Sound Synthesizer — полевой рекордер несуществующих мест</title>
  <meta name="description" content="Введите место и время — и прибор настроится на природу, которой нет: ветер, дождь, гроза и лес из простых электронных сигналов, без сэмплов.">

  <!-- Шрифты (Ubuntu и Ubuntu Mono): ссылка здесь, имена — в src/styles/fonts.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap">

  <!-- Стили: шрифты → тема → база → блоки (src/styles/blocks/*.css) -->
  <link rel="stylesheet" href="./src/styles/index.css">
</head>
<body>
  <!-- Каркас. Сверху — рисунок (мир из линий), снизу — компактный чёрно-белый прибор, лежащий под рисунком.
       Каждый блок рисует своё содержимое сам: модуль src/ui/<блок>.js, стили blocks/<блок>.css -->
  <main class="stage" aria-label="Experimental Sound Synthesizer">

    <!-- Рисунок: мир занимает всё свободное место, поверх ничего нет (название места — только для чтецов) -->
    <div class="stage__visual">
      <div class="world" aria-hidden="true"></div>
      <header class="hud visually-hidden"></header>
    </div>

    <!-- Прибор: рисуется в фиксированном размере и целиком масштабируется под ширину окна (см. main.js → fit) -->
    <div class="stage__dock">
      <section class="instrument" aria-label="Прибор">

        <div class="instrument__row">
        <!-- Микшер: у каждого канала индикатор уровня и фейдер -->
        <section class="instrument__module instrument__module--mixer mixer" aria-labelledby="t-mixer">
          <h2 class="instrument__title visually-hidden" id="t-mixer">МИКШЕР</h2>
          <div class="mixer__strips">
            <div class="mixer__strip">
              <div class="mixer__body"><div class="meter" data-meter="a"></div><div class="fader" data-param="mix.a" data-label="A" data-channel="a" data-default="0.7"></div></div>
              <span class="mixer__name" data-sign="a">A</span>
            </div>
            <div class="mixer__strip">
              <div class="mixer__body"><div class="meter" data-meter="b"></div><div class="fader" data-param="mix.b" data-label="B" data-channel="b" data-default="0.7"></div></div>
              <span class="mixer__name" data-sign="b">B</span>
            </div>
            <div class="mixer__strip">
              <div class="mixer__body"><div class="meter" data-meter="p"></div><div class="fader" data-param="mix.p" data-label="Ч" data-channel="p" data-default="0.7"></div></div>
              <span class="mixer__name" data-sign="p">Ч</span>
            </div>
            <div class="mixer__strip mixer__strip--master">
              <div class="mixer__body"><div class="meter" data-meter="master"></div><div class="fader" data-param="mix.master" data-label="ОБЩИЙ" data-default="0.8"></div></div>
              <span class="mixer__name" data-sign="m">ОБЩИЙ</span>
            </div>
          </div>
        </section>
        <!-- Голос A · ВОЗДУХ — сплошная линия, знак ○ -->
        <section class="instrument__module instrument__module--voice" aria-labelledby="t-voice-a">
          <h2 class="instrument__title visually-hidden" id="t-voice-a" data-sign="a">ГОЛОС A · ВОЗДУХ</h2>
          <div class="wave-switch" data-param="a.wave" data-channel="a"></div>
          <div class="instrument__sliders">
            <div class="slider" data-param="a.tune"           data-label="ВЫСОТА"       data-channel="a" data-format="hz-a" data-default="0.4"></div>
            <div class="slider" data-param="macro.a.character" data-label="ХАРАКТЕР"     data-channel="a" data-hint="Плотность облака и порывы" data-default="0.4"></div>
            <div class="slider" data-param="macro.a.space"     data-label="ПРОСТРАНСТВО" data-channel="a" data-hint="Даль и эхо" data-default="0.4"></div>
          </div>
        </section>
        <!-- Тропа: 16 наблюдений частиц -->
        <section class="instrument__module instrument__module--trail trail" aria-label="Тропа — 16 наблюдений частиц"></section>
        <!-- Голос B · СТИХИЯ — двойная линия, знак ═ -->
        <section class="instrument__module instrument__module--voice" aria-labelledby="t-voice-b">
          <h2 class="instrument__title visually-hidden" id="t-voice-b" data-sign="b">ГОЛОС B · СТИХИЯ</h2>
          <div class="wave-switch" data-param="b.wave" data-channel="b"></div>
          <div class="instrument__sliders">
            <div class="slider" data-param="b.tune"           data-label="ВЫСОТА"       data-channel="b" data-format="hz-b" data-default="0.4"></div>
            <div class="slider" data-param="macro.b.character" data-label="ХАРАКТЕР"     data-channel="b" data-hint="Зерно и дрожь" data-default="0.4"></div>
            <div class="slider" data-param="macro.b.space"     data-label="ПРОСТРАНСТВО" data-channel="b" data-hint="Даль и эхо" data-default="0.4"></div>
          </div>
        </section>
        <!-- Рекордер: запись, таймер, места-пресеты, старт и стоп, темп -->
        <section class="instrument__module instrument__module--recorder recorder" aria-label="Рекордер"></section>

      </section>
    </div>

  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
